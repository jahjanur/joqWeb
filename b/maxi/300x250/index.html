<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxi</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 300px;
            height: 250px;
            overflow: hidden; /* Prevents scrollbars */
            background-color: #ffffff;
        }
        .ad-container {
            width: 300px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        img {
            max-width: 100%;
            max-height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <a href="javascript:void(0)">
        <div class="ad-container">
            <img src="maxi.gif" alt="Advertisement">
        </div>
    </a>
</body>
</html>
